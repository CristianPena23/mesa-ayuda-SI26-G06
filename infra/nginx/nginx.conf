# Nginx del frontend — Grupo SI26-G06
# Este archivo se copia a /etc/nginx/conf.d/default.conf y nginx lo incluye DENTRO del bloque
# http {} de su configuración principal. Por eso las directivas de nivel http (server_tokens,
# limit_req_zone, real_ip) pueden ir aquí arriba, fuera del bloque server.

# --- Nivel http ---------------------------------------------------------------

# No revelar la versión de nginx en el encabezado Server ni en las páginas de error.
server_tokens off;

# IP real del cliente: el tráfico llega desde el contenedor cloudflared, así que $remote_addr
# sería siempre su IP interna. Cloudflare envía la IP real en CF-Connecting-IP. Solo se confía
# en ese encabezado si viene de la red interna de Docker del compose (172.30.66.0/24).
set_real_ip_from 172.30.66.0/24;
real_ip_header   CF-Connecting-IP;

# Límite de tasa para /api/auth/: 10 peticiones por minuto por IP de cliente.
# Frena la fuerza bruta contra el login y el abuso del registro.
limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# Backend por la tailnet (IP Tailscale de sg-robayo-backend, puerto API del grupo).
upstream api_backend {
    server 100.102.107.25:8106;
}

# --- Servidor -------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # No listar directorios (el repositorio base tenía autoindex on).
    autoindex off;

    # Tamaño máximo del cuerpo de una petición (los tickets son texto; 1 MB sobra).
    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # --- Encabezados de seguridad (always = también en respuestas de error) ----
    # Cada directiva de la CSP está justificada en el informe:
    #  default-src 'self'           todo se carga solo del mismo origen salvo que se indique otra cosa
    #  script-src 'self'            solo los .js del propio build de Angular; ningún script inline ni externo
    #  style-src 'self' 'unsafe-inline'  Angular y PrimeNG inyectan estilos de componentes en <style>
    #  img-src 'self' data:         imágenes propias e íconos SVG embebidos como data:
    #  font-src 'self' data:        fuentes de PrimeIcons empaquetadas en el build
    #  connect-src 'self'           las llamadas XHR/fetch solo pueden ir a este mismo origen (/api)
    #  object-src 'none'            sin plugins (Flash, applets, <object>)
    #  base-uri 'self'              impide cambiar la URL base con una etiqueta <base> inyectada
    #  form-action 'self'           los formularios solo pueden enviarse a este origen
    #  frame-ancestors 'none'       nadie puede meter el sitio en un iframe (anti-clickjacking)
    #  upgrade-insecure-requests    cualquier http:// residual se pide como https://
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Nota: los add_header de arriba solo se heredan si un location NO define sus propios
    # add_header. Por eso ningún location de abajo usa add_header.

    # Archivos ocultos (.git, .env, .htaccess...) nunca se sirven.
    location ~ /\. {
        deny all;
    }

    # --- Parche virtual mientras llega la Parte 6 -----------------------------
    # /debug/config expone secretos (hallazgo H14) y la documentación de la API no debe ser
    # pública. Se bloquean en el perímetro; la corrección de fondo se hace en el código.
    location ^~ /api/debug/ {
        return 404;
    }
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # --- Autenticación: con límite de tasa ----------------------------------
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        # No reenviar el encabezado "server: uvicorn" del backend (no revelar tecnología)
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # --- Resto de la API ------------------------------------------------------
    # /api/tickets -> http://backend:8106/tickets  (la barra final de proxy_pass quita el prefijo /api)
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        # No reenviar el encabezado "server: uvicorn" del backend (no revelar tecnología)
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # --- Aplicación Angular (SPA) -------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
