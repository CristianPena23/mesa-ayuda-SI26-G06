<!--
  Configuración centralizada de agentes Wazuh — Grupo SI26-G06
  Se instala en el manager:  /var/ossec/etc/shared/default/agent.conf
  El manager la distribuye sola a todos los agentes del grupo "default".

  D1 — Monitoreo de integridad de archivos (FIM) en TIEMPO REAL:
   - realtime="yes"        avisa en segundos, sin esperar el escaneo periódico
   - check_all="yes"       compara hash, tamaño, dueño, permisos y fecha
   - report_changes="yes"  incluye en la alerta QUÉ líneas cambiaron (diff)
   - restrict="..."        dentro de la carpeta, solo vigila los archivos indicados
  Las rutas que no existen en un nodo simplemente se ignoran en ese nodo.
-->
<agent_config os="Linux">
  <syscheck>
    <!-- Los 4 nodos: archivo del código de grupo -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/opt/examen</directories>

    <!-- sg-robayo-db: configuración de MySQL (incluye zz-si26-g06.cnf) -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/mysql</directories>

    <!-- sg-robayo-backend: docker-compose.yml y .env -->
    <directories realtime="yes" check_all="yes" report_changes="yes" restrict="docker-compose.yml$|\.env$">/home/sgadmin/backend</directories>
    <!-- El .env se vigila pero SIN diff: contiene secretos y, con report_changes, la contraseña
         de la BD y el JWT_SECRET terminarían copiados en las alertas del SIEM. -->
    <nodiff>/home/sgadmin/backend/.env</nodiff>

    <!-- sg-robayo-frontend: configuración de Nginx -->
    <directories realtime="yes" check_all="yes" report_changes="yes" restrict="nginx.conf$">/home/sgadmin/frontend</directories>
  </syscheck>
</agent_config>

<!--
  D2 — Solo el agente de sg-robayo-backend lee el log de autenticación de la app.
  El archivo solo existe en ese nodo; por eso el bloque se limita por nombre de agente.
-->
<agent_config name="sg-robayo-backend">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mesa_ayuda/app.log</location>
  </localfile>
</agent_config>
