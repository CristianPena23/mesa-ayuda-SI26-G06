# Configuracion del analisis SonarQube - backend (Python/FastAPI) - Grupo SI26-G06
# El token NUNCA va aqui: se pasa como variable de entorno al ejecutar el scanner.

# Identificador unico del proyecto en SonarQube (debe coincidir con el "project key" que creaste en la web)
sonar.projectKey=mesa-ayuda-backend
# Nombre visible del proyecto en el panel
sonar.projectName=mesa-ayuda-backend

# Carpeta con el codigo fuente a analizar (relativa a donde se ejecuta el scanner)
sonar.sources=app
# Version de Python para que el analizador aplique las reglas correctas
sonar.python.version=3.11
# Codificacion de los archivos
sonar.sourceEncoding=UTF-8
