# Configuracion del analisis SonarQube - frontend (Angular/TypeScript) - Grupo SI26-G06
# El token NUNCA va aqui: se pasa como variable de entorno al ejecutar el scanner.

# Identificador unico del proyecto en SonarQube (debe coincidir con el "project key" que creaste en la web)
sonar.projectKey=mesa-ayuda-frontend
# Nombre visible del proyecto en el panel
sonar.projectName=mesa-ayuda-frontend

# Carpeta con el codigo fuente a analizar
sonar.sources=src
# Excluimos lo que no es codigo nuestro o es generado: dependencias, compilados y pruebas
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts
# Codificacion de los archivos
sonar.sourceEncoding=UTF-8
